# Two checks on every pull request and on main, both on macOS because the iOS parts need Xcode:
#   check                JVM and Android-host tests, the module rules, the coverage gate, and both app builds.
#   ios-simulator-tests  Everything that runs on the iOS simulator: the Compose UI tests and the shared logic tests
#                        compiled for iOS. Slower, and sensitive to a slow runner, so it reports separately.
# On a pull request the result is also shown as a label: "checks passed" or "checks failed". The label is removed
# when a new run starts, so it always describes the latest commit. (Pull requests from forks get no label: their
# token cannot write.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check -x iosSimulatorArm64Test --continue
      - run: ./gradlew :androidApp:assembleDebug
      - name: Build the iOS app for the simulator
        run: >
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/ios ARCHS=arm64 CODE_SIGNING_ALLOWED=NO -quiet build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-check
          path: '**/build/reports/tests/**'

  ios-simulator-tests:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew iosSimulatorArm64Test --continue
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-ios-simulator
          path: '**/build/reports/tests/**'

  clear-label:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Remove the result label of the previous run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh label create "checks passed" --color 0e8a16 --description "Every CI check passed on the latest commit" --force
          gh label create "checks failed" --color d73a4a --description "A CI check failed on the latest commit" --force
          gh pr edit "$PR" --remove-label "checks passed" --remove-label "checks failed"

  label:
    needs: [check, ios-simulator-tests, clear-label]
    # Not when the run was cancelled (a newer push replaced it): that run sets the label.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Label the pull request with the result
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PASSED: ${{ needs.check.result == 'success' && needs.ios-simulator-tests.result == 'success' }}
        run: |
          if [ "$PASSED" = "true" ]; then label="checks passed"; else label="checks failed"; fi
          gh pr edit "$PR" --add-label "$label"
