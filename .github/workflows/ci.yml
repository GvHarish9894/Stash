# Two checks on every pull request and on main, both on macOS because the iOS parts need Xcode:
#   check                JVM and Android-host tests, the module rules, the coverage gate, and both app builds.
#   ios-simulator-tests  Everything that runs on the iOS simulator: the Compose UI tests and the shared logic tests
#                        compiled for iOS. Slower, and sensitive to a slow runner, so it reports separately.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check -x iosSimulatorArm64Test --continue
      - run: ./gradlew :androidApp:assembleDebug
      - name: Build the iOS app for the simulator
        run: >
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/ios ARCHS=arm64 CODE_SIGNING_ALLOWED=NO -quiet build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-check
          path: '**/build/reports/tests/**'

  ios-simulator-tests:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew iosSimulatorArm64Test --continue
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-ios-simulator
          path: '**/build/reports/tests/**'
